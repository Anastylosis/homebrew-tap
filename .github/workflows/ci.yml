name: CI

# Formulae here are generated by each project's release workflow, which checks
# Ruby syntax and that every placeholder was substituted. It cannot tell
# whether Homebrew will accept the result: a bad `desc`, an unreachable URL, a
# checksum that does not match the asset, or a binary that will not run all
# pass that check and fail on the user's machine. This runs the real thing.
on:
  push:
    branches: [master]
    paths: ['Formula/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['Formula/**', '.github/workflows/ci.yml']
  # Formulae point at release assets, so they can rot without anything here
  # changing — a deleted release or a retagged version breaks install for
  # everyone. Catch that on a schedule rather than from a bug report.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formulae:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two of the four blocks each formula declares. Homebrew resolves the
        # rest by architecture, which these runners cannot exercise.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tap this checkout
        run: brew tap anastylosis/tap "$GITHUB_WORKSPACE"

      - name: List formulae
        id: list
        run: |
          set -euo pipefail
          names=$(find Formula -name '*.rb' -exec basename {} .rb \; | sort | tr '\n' ' ')
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          if [ -z "$names" ]; then
            echo "No formulae yet — nothing to check."
          else
            echo "Checking: ${names}"
          fi

      - name: Audit
        if: steps.list.outputs.names != ''
        run: |
          set -euo pipefail
          for f in ${{ steps.list.outputs.names }}; do
            # --online fetches the URL and verifies the checksum, which is what
            # catches a retagged release or a mismatched sha256.
            #
            # Deliberately not --strict: that enforces homebrew-core submission
            # policy, much of which does not apply to a third-party tap, and a
            # red build everyone learns to ignore is worse than no build. What
            # is checked here is breakage a user would actually hit.
            brew audit --online "anastylosis/tap/${f}"
          done

      - name: Install and test
        if: steps.list.outputs.names != ''
        run: |
          set -euo pipefail
          for f in ${{ steps.list.outputs.names }}; do
            brew install --formula --verbose "anastylosis/tap/${f}"
            brew test "anastylosis/tap/${f}"
          done
